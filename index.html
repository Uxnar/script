                        "装完后先问 VLESS 的 SNI，再问 HY2 的 SNI，两者独立，互不影响。",
                        "直接回车 = 推荐项 `swscan.apple.com`；输编号 = 从 20 个候选里挑。",
                        "输 `0` 手动输入自定义域名，也可直接粘贴域名（含字母即按域名处理）。",
                        "编号超范围会提示并回落推荐项，不会中断安装。",
                        "HY2 的自签证书 CN / SAN 与链接里的 `sni=` 都跟随所选域名，不再固定 bing。"
                    ]
                }
            },
            {
                name: "install-singbox-auto.sh",
                title: "Sing-box 自动版（无人值守）",
                short: "自动版",
                tag: "无人值守",
                desc: "全程零输入部署：协议、端口、节点名均由命令行参数决定，检测到公网 IPv6 自动开启双栈，检测到旧版自动卸载重装。",
                recommend: true,
                badge: "🤖无人值守",
                note: {
                    title: "温馨提示",
                    cmd: "bash /tmp/install-singbox-auto.sh all 8443",
                    lines: [
                        "命令末尾需补端口号，`all` 写在端口前面：`all 端口` = 全部协议，只写端口 = 仅 VLESS Reality。",
                        "端口放最后，例如 8443；不填也能跑，运行时会询问一次。",
                        "带 `all` 时两协议共用该端口，防火墙需同时放行 TCP 与 UDP。"
                    ]
                }
            },
            {
                name: "install-cftun.sh",
                title: "Argo 临时隧道（增量）",
                short: "Argo 隧道",
                tag: "增量",
                desc: "给已装好的 sing-box 追加一条 VLESS+WS 入站与 Cloudflare 临时隧道，原有 Reality / HY2 节点原封不动。需先部署任意一个 Sing-box 脚本。",
                badge: "🧩增量",
                note: {
                    title: "使用说明",
                    cmd: "cftun",
                    lines: [
                        "前提：机器上已有 sing-box（先跑任意一个 Sing-box 脚本）。",
                        "面板顶部显示脚本与 cloudflared 的本地 / 远端版本，7 更新 cloudflared、8 更新脚本。",
                        "临时域名在隧道重启后会变，届时执行 `cftun` 选 2 重新生成链接。",
                        "想让 sb 面板生成链接时自动带上 argo 段：`bash install-cftun.sh --hook-sb`。",
                        "Reality / HY2 / TUIC 无法套 CDN，本脚本走的是独立的 WebSocket 入站。"
                    ]
                }
            },
            {
                name: "zzj.sh",
                title: "中转机脚本",
                short: "中转机",
                tag: "TCP+UDP",
                desc: "realm 内核的中转面板，每条规则可选双栈 / 仅 TCP / 仅 UDP，VLESS 与 HY2 都能过。面板顶部显示版本与运行状态，支持强制更新脚本。",
                badge: "🔀中转"
            }
        ];

        const prefixCmd = 'command -v curl >/dev/null 2>&1 && echo "curl already installed" || (command -v apt >/dev/null 2>&1 && apt update && apt install -y curl || command -v apk >/dev/null 2>&1 && apk update && apk add curl || command -v yum >/dev/null 2>&1 && yum install -y curl || command -v dnf >/dev/null 2>&1 && dnf install -y curl || { echo "ERROR: No supported package manager found"; exit 1; }); command -v bash >/dev/null 2>&1 && echo "bash already installed" || (command -v apt >/dev/null 2>&1 && apt install -y bash || command -v apk >/dev/null 2>&1 && apk add bash || command -v yum >/dev/null 2>&1 && yum install -y bash || command -v dnf >/dev/null 2>&1 && dnf install -y bash || { echo "ERROR: bash not available"; exit 1; });';

        const baseUrl = (() => {
            const cur = window.location.href.split('?')[0].split('#')[0];
            return cur.endsWith('/') ? cur : cur.substring(0, cur.lastIndexOf('/') + 1);
        })();

        /* 每次生成命令都换一个随机参数，绕开 CDN 与浏览器对静态文件的长缓存。 */
        const cacheToken = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

        const buildCommand = (item) =>
            `${prefixCmd} curl -k -sL -H 'Cache-Control: no-cache' ${baseUrl}${item.name}?v=${cacheToken()} -o /tmp/${item.name} && bash /tmp/${item.name}`;

        const nav = document.getElementById('nav');
        const detail = document.getElementById('detail');

        const el = (tag, cls, text) => {
            const n = document.createElement(tag);
            if (cls) n.className = cls;
            if (text != null) n.textContent = text;
            return n;
        };

        function fallbackCopy(text) {
            const ta = document.createElement('textarea');
            ta.value = text;
            ta.style.position = 'fixed';
            ta.style.opacity = '0';
            document.body.appendChild(ta);
            ta.select();
            let ok = false;
            try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
            document.body.removeChild(ta);
            return ok;
        }

        /* note.lines 里用反引号包裹的片段渲染成 <code> */
        function fillLine(node, text) {
            text.split('`').forEach((part, i) => {
                if (!part) return;
                if (i % 2) {
                    node.appendChild(el('code', null, part));
                } else {
                    node.appendChild(document.createTextNode(part));
                }
            });
        }

        const noteModal = document.getElementById('note-modal');
        const noteTitle = document.getElementById('note-title');
        const noteBody = document.getElementById('note-body');
        const noteCmd = document.getElementById('note-cmd');

        function showNote(note) {
            noteTitle.textContent = note.title || '命令已复制';
            noteBody.textContent = '';
            (note.lines || []).forEach(text => {
                const p = el('p', 'nline');
                fillLine(p, text);
                noteBody.appendChild(p);
            });
            if (note.cmd) {
                noteCmd.style.display = '';
                noteCmd.textContent = note.cmd;
            } else {
                noteCmd.style.display = 'none';
                noteCmd.textContent = '';
            }
            noteModal.classList.add('open');
        }

        function doCopy(text, btn, note) {
            const done = () => {
                btn.textContent = '已复制';
                btn.classList.add('copied');
                setTimeout(() => {
                    btn.textContent = '复制';
                    btn.classList.remove('copied');
                }, 1800);
                if (note) showNote(note);
            };
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(text).then(done, () => {
                    if (fallbackCopy(text)) done();
                    else btn.textContent = '请手动复制';
                });
            } else if (fallbackCopy(text)) {
                done();
            } else {
                btn.textContent = '请手动复制';
            }
        }

        /* ---------- 概览页 ---------- */
        function renderOverview() {
            detail.textContent = '';
            detail.classList.add('is-overview');

            const wrap = el('div', 'ov-wrap');

            const head = el('div', 'd-head');
            head.appendChild(el('h1', 'd-title ov-title', 'SingBox 一键部署'));
            head.appendChild(el('span', 'ov-tag', '项目说明'));
            wrap.appendChild(head);

            wrap.appendChild(el('p', 'ov-lead',
                '面向 VPS 的 sing-box 部署脚本集合：装内核、写配置、签证书、生成订阅链接，交互式与无人值守两种模式。默认只保留 Hysteria2 与 VLESS Reality 两种协议。'));

            const stats = el('div', 'ov-stats');
            [
                ['协议', 'Hysteria2 · VLESS Reality'],
                ['系统', 'Alpine 3.20+ · Debian 11+ · Ubuntu 18+'],
                ['资源', '内存 ≥100M · 磁盘 ≥1G']
            ].forEach(([k, v]) => {
                const box = el('div', 'ov-stat');
                box.append(el('div', 'ov-k', k), el('div', 'ov-v', v));
                stats.appendChild(box);
            });
            wrap.appendChild(stats);

            wrap.appendChild(el('p', 'ov-h', '流程'));
            wrap.appendChild(el('p', 'ov-note',
                '左侧选择脚本 → 复制命令 → 以 root 粘贴到服务器终端 → 按提示选择协议、端口与 SNI'));

            wrap.appendChild(el('p', 'ov-h', '注意'));
            [
                '必须使用 root 执行安装命令',
                '服务器需能正常访问 GitHub',
                'GitHub 下载慢时可用镜像 `SB_MIRROR=https://ghfast.top/`'
            ].forEach(txt => {
                const p = el('p', 'ov-note');
                fillLine(p, txt);
                wrap.appendChild(p);
            });

            const footBtn = el('button', 'btn ov-foot', '免责声明');
            footBtn.type = 'button';
            footBtn.onclick = () => {
                const m = document.getElementById('disc-modal');
                const bg = document.getElementById('disc-bg');
                if (bg) bg.classList.remove('on');
                if (m) m.classList.add('open');
            };
            wrap.appendChild(footBtn);

            detail.appendChild(wrap);
            document.title = 'SingBox 一键部署';
            syncNav(-1);
        }

        function syncNav(index) {
            [...nav.children].forEach(node => {
                const on = Number(node.dataset.idx) === index;
                node.classList.toggle('active', on);
                node.setAttribute('aria-current', on ? 'true' : 'false');
            });
        }

        function select(index) {
            if (index < 0) {
                renderOverview();
                history.replaceState(null, '', location.pathname + location.search);
            } else {
                renderDetail(index);
                history.replaceState(null, '', '#' + scripts[index].name);
            }
        }

        /* 右侧详情 */
        function renderDetail(index) {
            const item = scripts[index];
            detail.textContent = '';
            detail.classList.remove('is-overview');

            const head = el('div', 'd-head');
            head.appendChild(el('h1', 'd-title', item.title));
            if (item.recommend || item.badge) {
                head.appendChild(el('span', 'rec', item.badge || '\uD83D\uDD25 推荐'));
            }
            detail.appendChild(head);

            detail.appendChild(el('p', 'd-desc', item.desc));
            detail.appendChild(el('span', 'filechip', item.name));

            const term = el('div', 'term');
            const bar = el('div', 'term-bar');
            const dots = el('div', 'dots');
            dots.append(el('i'), el('i'), el('i'));
            bar.append(dots, el('span', 'term-label', 'root@server ~'));

            const btn = el('button', 'copy', '复制');
            btn.type = 'button';
            btn.onclick = () => doCopy(buildCommand(item), btn, item.note);
            bar.appendChild(btn);

            const cmd = el('div', 'cmd no-scrollbar', buildCommand(item));

            term.append(bar, cmd);
            detail.appendChild(term);

            syncNav(index);

            document.title = `${item.title} · SingBox 一键部署`;
        }

        /* 左侧目录：概览 + 脚本 */
        const mkNav = (idx, name, tag) => {
            const b = el('button', 'nav-item');
            b.type = 'button';
            b.dataset.idx = String(idx);
            b.appendChild(el('span', 'nav-idx', idx < 0 ? '\u00B7' : String(idx + 1).padStart(2, '0')));
            b.appendChild(el('span', 'nav-name', name));
            if (tag) {
                b.appendChild(el('span', 'nav-tag' + (tag === '推荐' ? ' hot' : ''), tag));
            }
            b.onclick = () => select(idx);
            nav.appendChild(b);
        };

        mkNav(-1, '项目说明');
        scripts.forEach((s, i) => mkNav(i, s.short || s.title, s.tag));

        const hashIdx = scripts.findIndex(s => '#' + s.name === location.hash);
        if (location.hash && hashIdx >= 0) {
            renderDetail(hashIdx);
        } else {
            renderOverview();
        }

        /* ---------- 免责声明 ---------- */
        const discModal = document.getElementById('disc-modal');
        const discBg = document.getElementById('disc-bg');
        const DISC_FOREVER = 'sb_disc_forever';
        const DISC_DAY = 'sb_disc_day';

        /* 关闭弹窗后铺满全屏的循环水印:行数与重复次数按视口自适应 */
        const DISC_LINES = [
            'AI 生成 · 仅供自娱自乐 · 不具备任何实际作用与参考价值',
            '不保证正确性 / 安全性 / 稳定性 / 可用性 · 后果自负',
            '作者不承担任何责任 · 请自行判断后使用',
            '这不是生产环境方案 · 请查阅官方文档'
        ];
        const DISC_SEP = '\u3000·\u3000';

        function buildDiscBg() {
            const inner = document.createElement('div');
            inner.className = 'disc-bg-inner';

            // 先量一份文本的宽度,再决定每行重复几次
            const probe = document.createElement('div');
            probe.className = 'disc-bg-line';
            probe.style.position = 'absolute';
            probe.style.visibility = 'hidden';
            probe.textContent = DISC_LINES[0] + DISC_SEP;
            inner.appendChild(probe);
            discBg.textContent = '';
            discBg.appendChild(inner);
            const unitW = probe.offsetWidth || 720;

            const vw = window.innerWidth;
            const vh = window.innerHeight;
            // 半份循环长度必须盖过整屏,再加一份余量
            const repeat = Math.max(3, Math.ceil((vw * 2) / unitW) + 1);
            // 行高约等于字号 1.65 倍,取 42px 保守估算,额外多铺 4 行
            const rows = Math.max(10, Math.ceil(vh / 42) + 4);

            inner.textContent = '';
            for (let i = 0; i < rows; i++) {
                const line = document.createElement('div');
                line.className = 'disc-bg-line';
                line.textContent = (DISC_LINES[i % DISC_LINES.length] + DISC_SEP).repeat(repeat);
                line.style.animationDuration = (100 + (i % 5) * 18) + 's';
                line.style.animationDelay = '-' + (i * 13 + 7) + 's';
                inner.appendChild(line);
            }
        }

        buildDiscBg();

        let discResizeTimer = null;
        window.addEventListener('resize', () => {
            clearTimeout(discResizeTimer);
            discResizeTimer = setTimeout(buildDiscBg, 300);
        });

        function discSuppressed() {
            try {
                if (localStorage.getItem(DISC_FOREVER) === '1') return true;
                if (localStorage.getItem(DISC_DAY) === new Date().toDateString()) return true;
            } catch (e) { /* 无痕模式忽略存储异常 */ }
            return false;
        }

        discModal.querySelectorAll('.btn').forEach(b => {
            b.onclick = () => {
                try {
                    if (b.dataset.act === 'forever') localStorage.setItem(DISC_FOREVER, '1');
                    if (b.dataset.act === 'today') localStorage.setItem(DISC_DAY, new Date().toDateString());
                } catch (e) { /* 忽略 */ }
                discModal.classList.remove('open');
                discBg.classList.add('on');
            };
        });

        // 弹窗被抑制时直接铺水印,否则等弹窗关闭后再铺
        if (discSuppressed()) {
            discBg.classList.add('on');
        } else {
            discModal.classList.add('open');
        }

        document.querySelectorAll('.modal').forEach(m => {
            if (m.dataset.noclose === '1') return;
            const close = () => m.classList.remove('open');
            m.querySelector('.close').onclick = close;
            m.addEventListener('click', (e) => { if (e.target === m) close(); });
            document.addEventListener('keydown', (e) => { if (e.key === 'Escape') close(); });
        });
    </script>
</body>
